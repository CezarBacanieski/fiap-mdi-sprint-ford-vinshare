rules:
  - id: hardcoded-secret
    patterns:
      - pattern-regex: "(?i)(api[_-]?key|secret|token)\\s*[:=]\\s*[\"'][A-Za-z0-9\\-_]{16,}[\"']"
    message: "Possible hardcoded secret."
    severity: ERROR
    languages: [javascript, typescript]

  - id: insecure-random
    patterns:
      - pattern: Math.random(...)
    message: "Avoid Math.random for security-sensitive operations."
    severity: WARNING
    languages: [javascript, typescript]
